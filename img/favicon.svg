<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A World of Bits">
  <!-- Two nodes exchanging information along an edge: the site's whole thesis,
       at 16 pixels. Petrol ground, coral sender, gold receiver. -->
  <rect width="64" height="64" rx="10" fill="#102428"/>
  <line x1="17" y1="32" x2="47" y2="32" stroke="#25454E" stroke-width="2.5"/>
  <circle cx="17" cy="32" r="7.5" fill="#FF7F6E"/>
  <circle cx="47" cy="32" r="7.5" fill="none" stroke="#F2C14E" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="2.6" fill="#E9F2F2"/>
</svg>
