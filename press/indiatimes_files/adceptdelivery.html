{

	var random_key;
	var host_name;
	var url_name;
	var arg_string;

	var server_name=location.hostname;

	loc_arg_list = loc_string.split('&');

	adceptclickthrough_url = "http://"+server_name+"/cgi-bin/adceptclickthrough.cgi";

	for (count=0;count<loc_arg_list.length;count++)
	{
	        var key_val = new Array();
        	key_val = loc_arg_list[count].split("=");
	        if (key_val[0] == 'random_key')
        	        random_key=key_val[1];
	        else

                	        host_name=key_val[1];
	                else

                                url_name=key_val[1];

	}


        arg_string = '&random_key='+random_key;
        arg_string += '&host_name='+host_name;
        arg_string += '&url_name='+url_name;


        var homewindow =  window.open(adceptclickthrough_url+'?'+arg_string, 'Intercept')

}
