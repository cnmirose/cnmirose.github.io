<html>
<head>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
<script type="text/javascript" src="http://maps.google.com/maps/api/js?sensor=false"></script>
<script type="text/javascript">
 var geocoder;
  var map;
  function initialize() {
    geocoder = new google.maps.Geocoder();

    var latlng = new google.maps.LatLng(40.8000, -73.9500);
//    var latlng = new google.maps.LatLng(40.730885,-73.997383);
    var myOptions = {
      zoom: 12,
      center: latlng,
      mapTypeId: google.maps.MapTypeId.ROADMAP
    }
    map = new google.maps.Map(document.getElementById("map_canvas"), myOptions);
  }

  function codeAddress(address) {
//    var address = document.getElementById("address").value;
    geocoder.geocode( { address: address}, function(results, status) {
      if (status == google.maps.GeocoderStatus.OK && results.length) {
        // You should always check that a result was returned, as it is
        // possible to return an empty results object.
        if (status != google.maps.GeocoderStatus.ZERO_RESULTS) {
     var myOptions = {
      zoom: 16,
      mapTypeId: google.maps.MapTypeId.ROADMAP
    }
    map = new google.maps.Map(document.getElementById("map_canvas"), myOptions);

          map.set_center(results[0].geometry.location);
          var marker = new google.maps.Marker({
              position: results[0].geometry.location,
              map: map
          });
        }
      } else {
        alert("Geocode was unsuccessful due to: " + status);
      }
    });
  }
</script>

<body onload="initialize()">
 <div id="map_canvas" style="width: 100%; height: 80%;"></div>
  <div>
    <input id="address" type="image" src="https://pub-e537d4245eb54823b4ef9e72eec121b5.r2.dev/nightfly/giraffe.gif" value="1 Battery Park Plaza" onclick="codeAddress('1 Battery Park Plaza')">

    <input id="address" type="image" src="https://pub-e537d4245eb54823b4ef9e72eec121b5.r2.dev/nightfly/acmlogo2.gif" value="55 W. 52nd Street" onclick="codeAddress('55 W. 52nd Street')">

    <input id="address" type="image" src="https://pub-e537d4245eb54823b4ef9e72eec121b5.r2.dev/nightfly/headbang.gif" value="536 W. 145th Street" onclick="codeAddress('536 W. 145th Street')">
  </div>
</body>
